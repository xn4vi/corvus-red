  <rect x="0" y="0" width="1280" height="6" fill="#166534"/>
  <rect x="0.5" y="0.5" width="1279" height="359" fill="none" stroke="#e3e7ed"/>

  <!-- escudo de ivanperezf.es -->
  <g transform="translate(96 96) scale(2.6)">
