<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" role="img" aria-label="CORVUS Red — auditor de seguridad de aplicaciones web para Claude Code">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E0F13"/>
      <stop offset="1" stop-color="#17090B"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1E2027" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="0.2" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#B3121F" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#B3121F" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="360" fill="url(#bg)"/>
  <rect width="1280" height="360" fill="url(#grid)"/>
  <rect width="1280" height="360" fill="url(#glow)"/>
  <rect x="0" y="352" width="1280" height="8" fill="#B3121F"/>

  <!-- emblema -->
  <g transform="translate(120 70) scale(1.85)">
    <polygon points="60,4 108,32 108,88 60,116 12,88 12,32" fill="#0E0F13" stroke="#B3121F" stroke-width="4"/>
    <path d="M18,60 L46,47 L58,33 L77,30 L93,40 L99,58 L92,76 L86,98 L62,93 L50,76 L38,67 Z" fill="#E8E6E1"/>
    <path d="M18,60 L46,47 L40,58 Z" fill="#B3121F"/>
    <path d="M62,93 L72,72 L86,98 Z M76,66 L92,76 L86,98 Z" fill="#B9B6AE"/>
    <circle cx="67" cy="45" r="4.5" fill="#B3121F"/>
    <circle cx="67" cy="45" r="1.6" fill="#0E0F13"/>
  </g>

  <g font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif">
    <text x="400" y="150" font-size="86" font-weight="800" letter-spacing="10" fill="#E8E6E1">CORVUS<tspan fill="#B3121F"> RED</tspan></text>
    <text x="404" y="196" font-size="22" letter-spacing="9" fill="#B3121F">OFFENSIVE SECURITY · CLAUDE CODE SKILL</text>
    <text x="404" y="244" font-size="26" fill="#C9C5BC">Auditor de seguridad de aplicaciones web — del alcance al informe</text>
    <text x="404" y="292" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" font-size="18" fill="#8A8780">
      <tspan fill="#B3121F">$</tspan> /corvus alcance → recon → caza → validar → informe
    </text>
  </g>
</svg>
