<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" role="img" aria-label="CORVUS Red — auditor de seguridad de aplicaciones web para Claude Code">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05080f"/>
      <stop offset=".55" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#07130d"/>
    </linearGradient>
    <radialGradient id="glowL" cx=".14" cy=".42" r=".42">
      <stop offset="0" stop-color="#22c55e" stop-opacity=".30"/>
      <stop offset="1" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowR" cx=".82" cy=".55" r=".38">
      <stop offset="0" stop-color="#166534" stop-opacity=".35"/>
      <stop offset="1" stop-color="#166534" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1c2a3d" stroke-width="1"/>
    </pattern>
    <linearGradient id="gridFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".55" stop-color="#fff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".95"/>
    </linearGradient>
    <mask id="gridMask"><rect width="1280" height="420" fill="url(#gridFade)"/></mask>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#39ff14"/>
      <stop offset="1" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="beakA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#166534"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="neon" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="card"><rect x="838" y="62" width="384" height="296" rx="12"/></clipPath>
  </defs>

  <!-- fondo -->
  <rect width="1280" height="420" fill="url(#bg)"/>
  <rect width="1280" height="420" fill="url(#grid)" mask="url(#gridMask)" opacity=".7"/>
  <rect width="1280" height="420" fill="url(#glowL)"/>
  <rect width="1280" height="420" fill="url(#glowR)"/>
  <rect x="0" y="414" width="1280" height="6" fill="#166534"/>
  <rect x="0" y="414" width="360" height="6" fill="#39ff14"/>

  <!-- cuervo con halo -->
  <g transform="translate(56 92) scale(2.45)">
    <path d="M27 23 L35 12 L49 11 L58 22 L57 38 L49 49 L47 59 L33 55 L28 42 Z" fill="#39ff14" opacity=".22" filter="url(#soft)"/>
    <path d="M27 23 L35 12 L49 11 L58 22 L57 38 L49 49 L47 59 L33 55 L28 42 Z" fill="#e8eef5"/>
    <path d="M27 23 L35 12 L49 11 L58 22 L57 38 L49 49 L47 59 L33 55 L28 42 Z" fill="none" stroke="#ffffff" stroke-opacity=".35" stroke-width=".6"/>
    <path d="M3 33 L27 23 L28 33 Z" fill="url(#beakA)"/>
    <path d="M3 33 L28 33 L28 42 Z" fill="#14532d"/>
    <rect x="37" y="20" width="6" height="6" fill="#39ff14" filter="url(#neon)"/>
  </g>

  <!-- titular -->
  <g font-family="Mona Sans, Inter, Segoe UI, Helvetica Neue, Arial, sans-serif">
    <text x="236" y="154" font-size="86" font-weight="800" letter-spacing="-1.5" fill="#f4f6f8">CORVUS<tspan fill="url(#red)" dx="18">RED</tspan></text>
    <rect x="240" y="180" width="10" height="10" fill="#39ff14" filter="url(#neon)"/>
    <text x="262" y="190" font-family="Chakra Petch, Segoe UI Semibold, Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" letter-spacing="5" fill="#86efac">WEB SECURITY AUDIT · CLAUDE CODE SKILL</text>
    <text x="238" y="242" font-size="25" font-weight="600" fill="#d2d8e1">Auditoría de seguridad web con método:</text>
    <text x="238" y="276" font-size="25" font-weight="600" fill="#ffffff">cada hallazgo, <tspan fill="#4ade80">verificado.</tspan></text>
  </g>

  <!-- chips -->
  <g font-family="Chakra Petch, Segoe UI Semibold, Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="1">
    <g transform="translate(238 312)">
      <rect width="112" height="34" rx="6" fill="#0f1b2d" stroke="#1f3b2b"/>
      <rect x="12" y="13" width="8" height="8" fill="#22c55e"/><text x="28" y="22" fill="#e5e9f0">33 FICHAS</text>
    </g>
    <g transform="translate(360 312)">
      <rect width="118" height="34" rx="6" fill="#0f1b2d" stroke="#1f3b2b"/>
      <rect x="12" y="13" width="8" height="8" fill="#22c55e"/><text x="28" y="22" fill="#e5e9f0">7 PUERTAS</text>
    </g>
    <g transform="translate(488 312)">
      <rect width="168" height="34" rx="6" fill="#0f1b2d" stroke="#1f3b2b"/>
      <rect x="12" y="13" width="8" height="8" fill="#22c55e"/><text x="28" y="22" fill="#e5e9f0">API · LLM · CÓDIGO</text>
    </g>
    <g transform="translate(666 312)">
      <rect width="128" height="34" rx="6" fill="#0f1b2d" stroke="#1f3b2b"/>
      <rect x="12" y="13" width="8" height="8" fill="#22c55e"/><text x="28" y="22" fill="#e5e9f0">INFORME PDF</text>
    </g>
  </g>

  <!-- terminal -->
  <g>
    <rect x="838" y="62" width="384" height="296" rx="12" fill="#39ff14" opacity=".10" filter="url(#soft)"/>
    <rect x="838" y="62" width="384" height="296" rx="12" fill="#070c16" stroke="#22314a"/>
    <g clip-path="url(#card)">
      <rect x="838" y="62" width="384" height="36" fill="#0d1626"/>
      <circle cx="860" cy="80" r="5" fill="#ef4444"/><circle cx="878" cy="80" r="5" fill="#eab308"/><circle cx="896" cy="80" r="5" fill="#22c55e"/>
      <text x="1030" y="85" text-anchor="middle" font-family="Chakra Petch, Segoe UI, Arial, sans-serif" font-size="12" letter-spacing="2" fill="#6b7a90">CORVUS · ENGAGEMENT</text>
    </g>
    <g font-family="Cascadia Mono, JetBrains Mono, Consolas, ui-monospace, monospace" font-size="14.5">
      <text x="858" y="128" fill="#e5e9f0"><tspan fill="#39ff14">❯</tspan> /corvus caza acceso</text>
      <text x="874" y="156" fill="#6b7a90">scope-check <tspan fill="#4ade80">DENTRO</tspan> · log · redact</text>
      <text x="858" y="188" fill="#ef4444">■</text><text x="876" y="188" fill="#8b9ab0">F-006</text><text x="930" y="188" fill="#e5e9f0">JWT alg:none</text><text x="1204" y="188" text-anchor="end" fill="#fca5a5">CRÍTICA 9.1</text>
      <text x="858" y="214" fill="#ef4444">■</text><text x="876" y="214" fill="#8b9ab0">F-002</text><text x="930" y="214" fill="#e5e9f0">SQLi login</text><text x="1204" y="214" text-anchor="end" fill="#fca5a5">CRÍTICA 9.1</text>
      <text x="858" y="240" fill="#f97316">■</text><text x="876" y="240" fill="#8b9ab0">F-005</text><text x="930" y="240" fill="#e5e9f0">BFLA usuarios</text><text x="1204" y="240" text-anchor="end" fill="#fdba74">ALTA 6.5</text>
      <text x="858" y="266" fill="#eab308">■</text><text x="876" y="266" fill="#8b9ab0">F-009</text><text x="930" y="266" fill="#e5e9f0">DOM XSS</text><text x="1204" y="266" text-anchor="end" fill="#fde68a">MEDIA 6.1</text>
      <line x1="858" y1="282" x2="1204" y2="282" stroke="#1c2a3d"/>
      <text x="858" y="306" fill="#e5e9f0"><tspan fill="#39ff14">✔</tspan> validador independiente</text><text x="1204" y="306" text-anchor="end" fill="#4ade80">11/11</text>
      <text x="858" y="334" fill="#e5e9f0"><tspan fill="#39ff14">→</tspan> informe-es.pdf <tspan fill="#39ff14">█</tspan></text>
    </g>
  </g>
</svg>
