<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" role="img" aria-label="CORVUS Red by Iván Pérez — auditor de seguridad de aplicaciones web para Claude Code">
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="11" cy="11" r="1.1" fill="#0f172a" fill-opacity=".16"/>
