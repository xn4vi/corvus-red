name: Fallo
description: Algo de la skill o de corvus.py no funciona como debería
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "⚠️ No pegues datos de clientes, tokens ni evidencia real. Si es un fallo de seguridad de la skill, usa un aviso de seguridad privado (ver SECURITY.md)."
  - type: textarea
    id: que
    attributes:
      label: Qué pasa
      description: Qué esperabas y qué ocurrió.
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Cómo reproducirlo
      placeholder: "1. /corvus alcance http://127.0.0.1:3000\n2. …"
  - type: input
    id: entorno
    attributes:
      label: Entorno
      placeholder: "Windows 11 · Python 3.12 · Claude Code 2.x"
